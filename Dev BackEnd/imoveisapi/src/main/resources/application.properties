spring.application.name=imoveisapi
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/talisma?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=51MB
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
spring.mvc.problemdetails.enabled=true
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
server.address=${APP_BIND_ADDRESS:127.0.0.1}
springdoc.api-docs.enabled=${APP_API_DOCS:false}
springdoc.paths-to-match=/api/v1/**
management.health.mail.enabled=false
