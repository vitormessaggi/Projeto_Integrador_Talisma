# Sem fallback para serviços locais no ambiente remoto.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=file:/run/secrets/rds-truststore.p12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=changeit
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.fallbackToSystemTrustStore=false
spring.flyway.enabled=false
server.address=0.0.0.0
server.forward-headers-strategy=framework
spring.mail.host=mailpit
spring.mail.port=1025
APP_STORAGE=s3
APP_S3_BUCKET=${S3_BUCKET}
AWS_REGION=${AWS_DEFAULT_REGION}
springdoc.api-docs.enabled=false
spring.task.scheduling.pool.size=1
