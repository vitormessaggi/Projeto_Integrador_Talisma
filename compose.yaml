name: talisma
services:
  mysql:
    build: ./Dev BancoDados/docker
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure .env}
      MYSQL_DATABASE: talisma
      MYSQL_USER: ${DB_USER:-talisma_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configure .env}
      TEST_DB_USER: ${TEST_DB_USER:-talisma_test}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:?Configure .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" talisma -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
volumes:
  mysql_data:
