# Substitua IP_PUBLICO pelo DNS público ou IPv4 coberto pelo certificado.
limit_req_zone $binary_remote_addr zone=talisma_lia:1m rate=30r/m;
server {
    listen 80;
    server_name IP_PUBLICO;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name IP_PUBLICO;
    ssl_certificate /etc/letsencrypt/live/talisma-api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talisma-api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 51m;
    # Não registrar coordenadas, identificadores ou parâmetros de busca no access log.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /chat {
        client_max_body_size 16k;
        limit_req zone=talisma_lia burst=15 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 28s;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
