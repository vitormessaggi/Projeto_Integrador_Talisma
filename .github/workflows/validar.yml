name: Validar aplicação
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:lintDebug
        working-directory: Dev Mobile/talisma-app
        env:
          API_URL: https://api.example.invalid
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: Dev BackEnd/imoveisapi/pom.xml
      - run: chmod +x mvnw && ./mvnw -B -Ptestcontainers verify
        working-directory: Dev BackEnd/imoveisapi
      - run: python3 scripts/sincronizar-legais.py --check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dev FrontEnd/talisma-imoveis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Dev FrontEnd/talisma-imoveis/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- privacidade.spec.ts
